# Builds the desktop app for Windows and macOS, checks that it installs and
# runs, and (for a version tag) attaches the installers to a GitHub Release.
#   Release:  bump "version" in desktop/package.json, then
#             git tag v1.0.1 && git push origin v1.0.1
#   Test run: Actions → Desktop app → Run workflow (installers appear as
#             downloadable artifacts on the run page).
name: Desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: |
          npm install --no-audit --no-fund
          cd desktop && npm install --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Build installers
        working-directory: desktop
        shell: bash
        run: ../.github/scripts/build-desktop.sh never
        env:
          S_CSC_LINK: ${{ secrets.CSC_LINK }}
          S_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          S_APPLE_ID: ${{ secrets.APPLE_ID }}
          S_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          S_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Windows: install silently the way a customer would (per-user, no
      # admin prompt), then launch the installed app and use it.
      - name: Install and run the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem desktop/dist -Filter '1000-Decisions-Setup-*.exe' | Select-Object -First 1
          Write-Host "Installing $($setup.Name) ($([math]::Round($setup.Length / 1MB)) MB)"
          $t0 = Get-Date
          $proc = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          Write-Host "Installer exited with code $($proc.ExitCode) after $([math]::Round(((Get-Date) - $t0).TotalSeconds)) s"
          $exe = $null
          for ($i = 0; $i -lt 240 -and -not $exe; $i++) {
            $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter '1000 Decisions.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $exe) { Start-Sleep -Seconds 1 }
          }
          if (-not $exe) { Get-ChildItem "$env:LOCALAPPDATA\Programs" -ErrorAction SilentlyContinue; Get-Process | Where-Object { $_.ProcessName -match '1000|Setup|nsis|Un_' } | Format-Table -AutoSize; throw 'Installed app not found' }
          Write-Host "App present after $([math]::Round(((Get-Date) - $t0).TotalSeconds)) s"
          Start-Sleep -Seconds 5
          Get-Process | Where-Object { $_.ProcessName -like '1000*' } | Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host "Installed at $($exe.FullName)"
          if (-not (Test-Path "$env:USERPROFILE\Desktop\1000 Decisions.lnk") -and -not (Test-Path "$env:PUBLIC\Desktop\1000 Decisions.lnk")) { Write-Warning 'Desktop shortcut not found' }
          $env:EXE = $exe.FullName
          node tests/desktop.smoke.js

      - name: Run the macOS app
        if: runner.os == 'macOS'
        run: |
          APP="$(ls -d desktop/dist/mac*/1000\ Decisions.app | head -1)"
          codesign -dv "$APP" 2>&1 | head -5 || true
          spctl -a -vv "$APP" 2>&1 || true
          node tests/desktop.smoke.js

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        shell: bash
        run: ../.github/scripts/build-desktop.sh always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          S_CSC_LINK: ${{ secrets.CSC_LINK }}
          S_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          S_APPLE_ID: ${{ secrets.APPLE_ID }}
          S_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          S_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
          if-no-files-found: ignore
