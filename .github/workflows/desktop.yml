# Builds the desktop app for Windows and macOS, checks that it installs and
# runs, and (for a version tag) attaches the installers to a GitHub Release.
#   Release:  bump "version" in desktop/package.json, then
#             git tag v1.0.1 && git push origin v1.0.1
#   Test run: Actions → Desktop app → Run workflow (installers appear as
#             downloadable artifacts on the run page).
name: Desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: |
          npm install --no-audit --no-fund
          cd desktop && npm install --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Build installers
        working-directory: desktop
        run: npx electron-builder --publish never
        env:
          # Optional code signing. Leave unset to build unsigned.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}

      # Windows: install silently the way a customer would (per-user, no
      # admin prompt), then launch the installed app and use it.
      - name: Install and run the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem desktop/dist -Filter '1000-Decisions-Setup-*.exe' | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter '1000 Decisions.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Installed app not found' }
          Write-Host "Installed at $($exe.FullName)"
          if (-not (Test-Path "$env:USERPROFILE\Desktop\1000 Decisions.lnk") -and -not (Test-Path "$env:PUBLIC\Desktop\1000 Decisions.lnk")) { Write-Warning 'Desktop shortcut not found' }
          $env:EXE = $exe.FullName
          node tests/desktop.smoke.js

      - name: Run the macOS app
        if: runner.os == 'macOS'
        run: |
          APP="$(ls -d desktop/dist/mac*/1000\ Decisions.app | head -1)"
          codesign -dv "$APP" 2>&1 | head -5 || true
          spctl -a -vv "$APP" 2>&1 || true
          node tests/desktop.smoke.js

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
          if-no-files-found: ignore
